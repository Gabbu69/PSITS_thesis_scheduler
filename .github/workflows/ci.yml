name: Verify scheduler
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: thesis_scheduler_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scheduler:ci-database-only@localhost:5432/thesis_scheduler_test?schema=public
      BETTER_AUTH_SECRET: ci-only-fictional-database-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      ALLOW_TEST_FIXTURES: "1"
      DEMO_PASSWORD: ci-fictional-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: touch .env
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:test-fixtures
      - run: npm test
      - run: npm run typecheck
      - run: npm run verify
      - run: npm run build
      - name: Verify Turnstile sign-in and authenticator recovery in a fresh database
        env:
          PGPASSWORD: ci-database-only
          DATABASE_URL: postgresql://scheduler:ci-database-only@localhost:5432/scheduler_auth_test?schema=public
          SETUP_KEY: ci-only-setup-key-for-the-isolated-auth-test-database
        run: |
          psql -h localhost -U scheduler -d postgres -c 'CREATE DATABASE scheduler_auth_test;'
          npm run db:migrate
          npm start > /tmp/scheduler-auth-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-real-auth.mjs
